name: Fork Release

# Desktop release + auto-update channel for the olehsharov/buzz fork.
#
# Upstream release.yml cannot run here (Block OIDC codesign action, four
# platforms, CHANGELOG gate, rolling promote tag). This workflow builds
# Apple Silicon macOS and Linux x64, signs macOS with the fork's self-signed
# "Buzz Local Code Signing" certificate (so the designated requirement, and
# with it TCC and keychain grants, stays identical across updates), signs the
# updater artifacts with the fork's Tauri updater key, and publishes a normal
# (non-prerelease) GitHub Release whose latest.json is served at
# https://github.com/olehsharov/buzz/releases/latest/download/latest.json.
#
# Runbook: docs/fork-release.md.
#
# A desktop-v*-fork.N tag also matches upstream release.yml's trigger; its
# jobs are skipped there by the block/buzz repository guard.

concurrency:
  group: fork-desktop-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'desktop-v[0-9]*-fork.[0-9]*'

permissions:
  contents: read

env:
  FORK_REPO: olehsharov/buzz
  # Baked into every installed app; changing it strands existing installs.
  BUZZ_UPDATER_ENDPOINT: https://github.com/olehsharov/buzz/releases/latest/download/latest.json
  VITE_BUZZ_RELEASES_URL: https://github.com/olehsharov/buzz/releases/latest
  APPLE_SIGNING_IDENTITY: Buzz Local Code Signing
  # SHA-1 of the "Buzz Local Code Signing" leaf certificate. The installed
  # app's designated requirement pins it; a different cert resets TCC
  # (mic/camera) and keychain grants on update.
  EXPECTED_LEAF_SHA1: 8c583bad48232dc40ebcf8aed2217e6ef812d8e7

jobs:
  setup:
    name: Setup
    if: github.repository == 'olehsharov/buzz'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Validate version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-fork\.[0-9]+$'; then
            echo "::error::Invalid fork version '$VERSION'. Expected <major>.<minor>.<patch>-fork.<N> (e.g. 0.5.27-fork.1)"
            exit 1
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        id: source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/verify-release-ref.sh desktop-v "$VERSION"
          echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

      - name: Require committed updater public key
        run: |
          if [[ ! -s desktop/fork-updater.pub ]]; then
            echo "::error file=desktop/fork-updater.pub::desktop/fork-updater.pub is missing or empty. Generate the updater key (pnpm tauri signer generate -w ~/.tauri/buzz-fork.key), commit the .pub contents as desktop/fork-updater.pub, and re-tag. See docs/fork-release.md."
            exit 1
          fi

  macos-arm64:
    name: Release macOS (Apple Silicon)
    if: github.repository == 'olehsharov/buzz'
    runs-on: macos-latest
    needs: setup
    # Upstream uses 60; the first fork run also builds the metal llama cache
    # and has no Cargo cache.
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      archive_name: ${{ steps.artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Load updater public key
        run: |
          [[ -s desktop/fork-updater.pub ]] || { echo "::error file=desktop/fork-updater.pub::desktop/fork-updater.pub is missing or empty (see docs/fork-release.md)"; exit 1; }
          echo "BUZZ_UPDATER_PUBLIC_KEY=$(tr -d '\n' < desktop/fork-updater.pub)" >> "$GITHUB_ENV"

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Import signing certificate
        env:
          MACOS_SIGNING_P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$MACOS_SIGNING_P12_BASE64" ]] || { echo "::error::secret MACOS_SIGNING_P12_BASE64 is not set (see docs/fork-release.md)"; exit 1; }
          KC="$RUNNER_TEMP/buzz-sign.keychain-db"
          KCPW="$(openssl rand -hex 16)"
          printf '%s' "$MACOS_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KCPW" "$KC"
          # Tauri signs at the very end of a long build; keep the keychain
          # unlocked well past the job timeout so codesign never hits a lock.
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          # Fail here, not 40 minutes later, if the p12 holds a different cert.
          ACTUAL_SHA1="$(security find-certificate -c "$APPLE_SIGNING_IDENTITY" -Z "$KC" | awk '/^SHA-1 hash:/ {print tolower($3)}')"
          if [[ "$ACTUAL_SHA1" != "$EXPECTED_LEAF_SHA1" ]]; then
            echo "::error::p12 certificate SHA-1 is '${ACTUAL_SHA1:-<none>}', expected $EXPECTED_LEAF_SHA1 — the designated requirement would change"
            exit 1
          fi
          # codesign refuses an untrusted self-signed leaf; trust it for code signing.
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KC" > "$RUNNER_TEMP/sign.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/sign.pem"
          security find-identity -v -p codesigning "$KC" | grep -q "$APPLE_SIGNING_IDENTITY" || {
            echo "::error::'$APPLE_SIGNING_IDENTITY' is not a valid codesigning identity after import"
            security find-identity -v -p codesigning "$KC"
            exit 1
          }
          echo "SIGNING_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      # Mesh rev derived from Cargo.lock (no lockstep edit on dep bump); cache key tracks it.
      - name: Resolve mesh-llm rev
        id: mesh_rev
        run: |
          set -euo pipefail
          REV=$(python3 -c 'import tomllib; d=tomllib.load(open("Cargo.lock", "rb")); p=next(p for p in d["package"] if p["name"] == "mesh-llm-sdk"); print(p["source"].rsplit("#", 1)[1])')
          [[ -n "$REV" ]] || { echo "::error::could not resolve mesh-llm rev from Cargo.lock"; exit 1; }
          echo "rev=$REV" >> "$GITHUB_OUTPUT"
          echo "short=${REV:0:7}" >> "$GITHUB_OUTPUT"
      - name: Restore mesh llama build cache
        id: llama_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}
      - name: Build mesh llama native libraries
        if: steps.llama_cache.outputs.cache-hit != 'true'
        env:
          MESH_REV_SHORT: ${{ steps.mesh_rev.outputs.short }}
        run: |
          set -euo pipefail
          cargo fetch --manifest-path desktop/src-tauri/Cargo.toml
          SHORT="$MESH_REV_SHORT"
          MESH_ROOT=$(find "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" -path "*/$SHORT" -type d -name "$SHORT" | head -1)
          if [[ -z "$MESH_ROOT" ]]; then
            echo "::error::mesh-llm checkout for $SHORT not found after cargo fetch"
            exit 1
          fi
          export LLAMA_STAGE_BACKEND=metal
          export LLAMA_STAGE_BUILD_DIR="$GITHUB_WORKSPACE/.cache/mesh-llama/build-stage-abi-metal"
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          "$MESH_ROOT/scripts/prepare-llama.sh" pinned
          "$MESH_ROOT/scripts/build-llama.sh" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Save mesh llama build cache
        if: steps.llama_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ github.workspace }}/.cache/mesh-llama
          key: mesh-llama-${{ runner.os }}-metal-${{ steps.mesh_rev.outputs.rev }}

      # Signed by Tauri itself (no --no-sign): it codesigns inside-out with
      # APPLE_SIGNING_IDENTITY, hardened runtime and Entitlements.plist, then
      # builds Buzz.app.tar.gz from the signed app and minisigns it. With no
      # APPLE_ID / API key the bundler skips notarization.
      - name: Build signed Tauri app
        run: cd desktop && pnpm tauri build --verbose --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
          LLAMA_STAGE_BACKEND: metal
          LLAMA_STAGE_BUILD_DIR: ${{ github.workspace }}/.cache/mesh-llama/build-stage-abi-metal
          SKIPPY_LLAMA_AUTO_BUILD: "0"
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"

      - name: Locate DMG
        id: dmg
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      # The DMG itself is not signed, so editing it after the build is safe.
      - name: Set DMG Finder label text size
        env:
          DMG_PATH: ${{ steps.dmg.outputs.dmg }}
        run: desktop/scripts/set-dmg-finder-text-size.sh "$DMG_PATH" 14

      # No spctl --assess: a self-signed, un-notarized app is always "rejected".
      - name: Verify code signature
        run: |
          set -euo pipefail
          APP=desktop/src-tauri/target/release/bundle/macos/Buzz.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d -r- "$APP" 2>&1 | tee "$RUNNER_TEMP/designated-requirement.txt"
          grep -q "certificate leaf = H\"$EXPECTED_LEAF_SHA1\"" "$RUNNER_TEMP/designated-requirement.txt" || {
            echo "::error::designated requirement changed — TCC/keychain grants would reset"
            exit 1
          }
          desktop/scripts/verify-macos-entitlements.sh "$APP"

      - name: Locate build artifacts
        id: artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"

          # Find the DMG (Tauri names it Buzz_<version>_<arch>.dmg)
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          if [[ -z "$DMG" ]]; then
            echo "::error::No DMG found in $BUNDLE_DIR/dmg"
            exit 1
          fi
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

          # Find the updater .tar.gz and .sig. Give each architecture a unique
          # release basename before artifacts are merged by the final writer.
          ARCHIVE=$(find "$BUNDLE_DIR/macos" -name '*.tar.gz' ! -name '*.sig' -type f | head -1)
          SIG="${ARCHIVE}.sig"
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            echo "::error::Updater archive or signature not found in $BUNDLE_DIR/macos"
            exit 1
          fi
          RENAMED="$(dirname "$ARCHIVE")/Buzz_${VERSION}_aarch64.app.tar.gz"
          mv "$ARCHIVE" "$RENAMED"
          mv "$SIG" "${RENAMED}.sig"
          ARCHIVE="$RENAMED"
          SIG="${RENAMED}.sig"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Read updater signature
        id: read-sig
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.artifacts.outputs.sig }}

      - name: Stage Apple Silicon release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-macos-arm64
          if-no-files-found: error
          path: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.archive }}
            ${{ steps.artifacts.outputs.sig }}

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/sign.pem"

  linux-x64:
    name: Release Linux
    if: github.repository == 'olehsharov/buzz'
    runs-on: ubuntu-latest
    # Digest-pinned like the SHA-pinned actions below; Renovate keeps it fresh.
    # glibc floor of the AppImage/deb = this image (Ubuntu 24.04, glibc 2.39).
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    needs: setup
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # AppImage tools (linuxdeploy, appimagetool) are themselves AppImages.
      # Containers lack FUSE, so we must use the extract-and-run fallback.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    # This job runs in a container where the default run shell is dash;
    # the AppImage steps below use bash-only syntax ([[ ]], mapfile, arrays).
    defaults:
      run:
        shell: bash
    outputs:
      archive_name: ${{ steps.linux-artifacts.outputs.archive_name }}
      sig: ${{ steps.read-sig.outputs.sig }}
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Must run first: bare ubuntu:24.04 ships without curl, wget, git, or
          # ca-certificates. activate-hermit bootstraps via curl+HTTPS (needs
          # both), and actions/checkout falls back to a REST tarball without git.
          # Running as root — no sudo needed.
          apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=120 \
            build-essential \
            ca-certificates \
            curl \
            desktop-file-utils \
            file \
            git \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            squashfs-tools \
            wget \
            xdg-utils
          # Install GitHub CLI — preinstalled on runners but absent in containers.
          # wget and ca-certificates are now available from the step above.
          mkdir -p -m 755 /etc/apt/keyrings
          wget -q --tries=3 --timeout=30 -O /usr/share/keyrings/githubcli-archive-keyring.gpg \
            https://cli.github.com/packages/githubcli-archive-keyring.gpg
          # Pin the keyring like appimagetool below. If GitHub rotates the
          # keyring this fails loudly — recompute and update the hash.
          echo "6084d5d7bd8e288441e0e94fc6275570895da18e6751f70f057485dc2d1a811b  /usr/share/keyrings/githubcli-archive-keyring.gpg" | sha256sum -c
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify tag-bound release source
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: desktop/src-tauri
          lookup-only: true

      - name: Install appimagetool
        run: |
          # Pin to an immutable release tag to avoid supply-chain drift from the
          # mutable `continuous` tag. Tag: 1.9.1, asset: appimagetool-<arch>.AppImage
          # (https://github.com/AppImage/appimagetool/releases/tag/1.9.1)
          case "$(uname -m)" in
            x86_64)  ARCH_SUFFIX="x86_64" ;;
            aarch64) ARCH_SUFFIX="aarch64" ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          wget -q --tries=3 --timeout=30 -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${ARCH_SUFFIX}.AppImage"
          # SHA256 integrity check. Refuse to run an unverified binary: if a new
          # arch (e.g. aarch64) is enabled in CI, compute its hash and add it here.
          if [[ "$ARCH_SUFFIX" == "x86_64" ]]; then
            echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          else
            echo "::error::No pinned SHA256 for appimagetool-${ARCH_SUFFIX} — add it before enabling this architecture"
            exit 1
          fi
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          # appimagetool otherwise fetches the AppImage type2 runtime from the
          # MUTABLE `continuous` tag at repack time — the runtime is the first
          # code users execute, so pin it too. Tag: 20251108, hash is for the
          # x86_64 asset (non-x86_64 already hard-fails above).
          # (https://github.com/AppImage/type2-runtime/releases/tag/20251108)
          wget -q --tries=3 --timeout=30 -O /tmp/appimage-runtime \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-${ARCH_SUFFIX}"
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime" | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo "APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        run: just desktop-install-ci

      - name: Patch version
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Build sidecars
        run: |
          cargo build --release -p buzz-acp -p buzz-agent -p buzz-backend-kubernetes -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Load updater public key
        run: |
          [[ -s desktop/fork-updater.pub ]] || { echo "::error file=desktop/fork-updater.pub::desktop/fork-updater.pub is missing or empty (see docs/fork-release.md)"; exit 1; }
          echo "BUZZ_UPDATER_PUBLIC_KEY=$(tr -d '\n' < desktop/fork-updater.pub)" >> "$GITHUB_ENV"

      - name: Generate release config
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Build Linux Tauri app
        run: cd desktop && pnpm tauri build --verbose --ci --bundles deb,appimage --features mesh-llm --config src-tauri/tauri.release.conf.json
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fix AppImage (remove infra libs, shim host GStreamer)
        run: |
          mapfile -t APPIMAGES < <(find desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -type f)
          if [[ ${#APPIMAGES[@]} -eq 0 ]]; then
            echo "::error::No AppImage found to post-process"
            exit 1
          fi
          if [[ ${#APPIMAGES[@]} -gt 1 ]]; then
            echo "::error::Expected exactly one AppImage, found ${#APPIMAGES[@]}: ${APPIMAGES[*]}"
            exit 1
          fi
          bash desktop/scripts/fix-appimage.sh "${APPIMAGES[0]}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate Linux build artifacts
        id: linux-artifacts
        run: |
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"

          DEB=$(find "$BUNDLE_DIR/deb" -name '*.deb' -type f | head -1)
          if [[ -z "$DEB" ]]; then
            echo "::error::No DEB found in $BUNDLE_DIR/deb"
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage' -type f | head -1)
          if [[ -z "$APPIMAGE" ]]; then
            echo "::error::No AppImage found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"

          # Updater archive: Tauri 2.11+ with createUpdaterArtifacts signs the
          # AppImage directly (*.AppImage + *.AppImage.sig). Earlier versions
          # wrapped it in a tar.gz. Try the new format first, fall back to legacy.
          ARCHIVE=$(find "$BUNDLE_DIR/appimage" -name '*.AppImage.tar.gz' ! -name '*.sig' -type f | head -1)
          if [[ -n "$ARCHIVE" ]]; then
            SIG="${ARCHIVE}.sig"
          else
            ARCHIVE="$APPIMAGE"
            SIG="${APPIMAGE}.sig"
          fi
          if [[ -z "$ARCHIVE" || ! -f "$SIG" ]]; then
            echo "::error::AppImage updater archive or signature not found in $BUNDLE_DIR/appimage"
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "archive_name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"

      - name: Read updater signature
        id: read-sig
        run: echo "sig=$(cat "$SIG_PATH")" >> "$GITHUB_OUTPUT"
        env:
          SIG_PATH: ${{ steps.linux-artifacts.outputs.sig }}

      # NOTE: .deb is NOT auto-updatable (Tauri updater constraint — only AppImage supports it on Linux)
      - name: Stage Linux release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-release-linux-x64
          if-no-files-found: error
          path: |
            ${{ steps.linux-artifacts.outputs.deb }}
            ${{ steps.linux-artifacts.outputs.appimage }}
            ${{ steps.linux-artifacts.outputs.archive }}
            ${{ steps.linux-artifacts.outputs.sig }}

  publish:
    name: Publish release and latest.json
    if: |
      always() &&
      github.repository == 'olehsharov/buzz' &&
      needs.setup.result == 'success' &&
      needs.macos-arm64.result == 'success' &&
      needs.linux-x64.result == 'success' &&
      github.ref == format('refs/tags/desktop-v{0}', needs.setup.outputs.version)
    runs-on: ubuntu-latest
    needs: [setup, macos-arm64, linux-x64]
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.setup.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag-bound release source
        run: scripts/verify-release-ref.sh desktop-v "$VERSION"

      - name: Download staged release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-release-*
          path: staged-by-platform

      - name: Flatten staged artifacts without basename collisions
        run: |
          set -euo pipefail
          mkdir staged
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            [[ ! -e "staged/$name" ]] || {
              echo "::error::release artifact basename collision: $name"
              exit 1
            }
            cp "$file" "staged/$name"
          done < <(find staged-by-platform -type f -print0)

      - name: Write signature files
        env:
          SIG_ARM64: ${{ needs.macos-arm64.outputs.sig }}
          SIG_LINUX: ${{ needs.linux-x64.outputs.sig }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/sigs
          [[ -n "$SIG_ARM64" ]] || { echo "::error::Missing signature for darwin-aarch64"; exit 1; }
          [[ -n "$SIG_LINUX" ]] || { echo "::error::Missing signature for linux-x86_64"; exit 1; }
          printf '%s' "$SIG_ARM64" > /tmp/sigs/darwin-aarch64.sig
          printf '%s' "$SIG_LINUX" > /tmp/sigs/linux-x86_64.sig

      - name: Verify staged set has every updater archive
        env:
          ARCHIVE_ARM64: ${{ needs.macos-arm64.outputs.archive_name }}
          ARCHIVE_LINUX: ${{ needs.linux-x64.outputs.archive_name }}
        run: |
          set -euo pipefail
          assets=$(find staged -type f -exec basename {} \;)
          for archive in "$ARCHIVE_ARM64" "$ARCHIVE_LINUX"; do
            [[ -n "$archive" ]] || { echo "::error::successful platform has no archive"; exit 1; }
            grep -Fxq "$archive" <<<"$assets" || { echo "::error::staged artifacts missing $archive"; exit 1; }
          done

      - name: Generate latest.json
        env:
          ARCHIVE_ARM64: ${{ needs.macos-arm64.outputs.archive_name }}
          ARCHIVE_LINUX: ${{ needs.linux-x64.outputs.archive_name }}
        run: |
          set -euo pipefail
          BASE="https://github.com/${FORK_REPO}/releases/download/desktop-v${VERSION}"
          TRIPLES=(
            "darwin-aarch64:/tmp/sigs/darwin-aarch64.sig:${BASE}/${ARCHIVE_ARM64}"
            "linux-x86_64:/tmp/sigs/linux-x86_64.sig:${BASE}/${ARCHIVE_LINUX}"
          )
          [ "${#TRIPLES[@]}" -ge 2 ] || { echo "::error::too few platforms (${#TRIPLES[@]})"; exit 1; }
          bash desktop/scripts/generate-oss-latest-json.sh "$VERSION" "${TRIPLES[@]}" > staged/latest.json
          cat staged/latest.json
          jq -e --arg v "$VERSION" '.version == $v and (.platforms | has("darwin-aarch64") and has("linux-x86_64"))' staged/latest.json > /dev/null

      - name: Create or verify versioned draft
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "$NOTES_FILE" <<EOF
          Buzz Desktop v${VERSION} — fork build of olehsharov/buzz. Installed fork builds update themselves from this release.

          **macOS (Apple Silicon):** open the \`.dmg\` and drag Buzz to Applications. The app is self-signed and not notarized, so the first launch of a downloaded DMG is blocked: System Settings → Privacy & Security → Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/Buzz.app\`. Later in-app updates need no extra step.

          **Linux (x86_64):** use the \`.AppImage\` (\`chmod +x\`, keep it at a stable writable path). Only the AppImage auto-updates; the \`.deb\` must be reinstalled by hand. Needs FUSE 2 (\`libfuse2t64\` on Ubuntu 24.04) or run with \`--appimage-extract-and-run\`.

          Same bundle id as official Buzz: installing an official build over this one switches the update channel back to upstream.
          EOF
          if gh release view "desktop-v${VERSION}" >/dev/null 2>&1; then
            EXISTING_SHA=$(gh release view "desktop-v${VERSION}" --json targetCommitish --jq .targetCommitish)
            IS_DRAFT=$(gh release view "desktop-v${VERSION}" --json isDraft --jq .isDraft)
            [[ "$EXISTING_SHA" == "$SOURCE_SHA" ]] || {
              echo "::error::existing release targets $EXISTING_SHA, not the immutable source"; exit 1;
            }
            if [[ "$IS_DRAFT" != true ]]; then
              echo "already_published=true" >> "$GITHUB_ENV"
            fi
          else
            # Never --prerelease: /releases/latest (the updater endpoint) skips prereleases.
            gh release create "desktop-v${VERSION}" \
              --draft \
              --target "$SOURCE_SHA" \
              --title "Buzz Desktop v${VERSION}" \
              --notes-file "$NOTES_FILE" \
              --generate-notes
          fi

      - name: Upload complete artifact set to versioned draft
        if: env.already_published != 'true'
        run: |
          mapfile -t files < <(find staged -type f -print)
          [[ "${#files[@]}" -gt 0 ]] || { echo "::error::no staged release artifacts"; exit 1; }
          gh release upload "desktop-v${VERSION}" "${files[@]}" --clobber

      # Publish only after every asset (including latest.json) is uploaded, so
      # /releases/latest never points at a half-uploaded release.
      - name: Publish complete versioned release as latest
        if: env.already_published != 'true'
        run: gh release edit "desktop-v${VERSION}" --draft=false --latest
